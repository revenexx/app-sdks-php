# The shared security scan (revenexx/.github, PE-1135), run from the local copy in
# security-scan.yml: a public repository cannot call the private original.
name: Security

on:
  pull_request:
  # Direct pushes to main never reach the pull_request trigger.
  push:
    branches: [main]
  # Weekly: advisories land against unchanged code. GitHub disables a schedule
  # after 60 days without activity, which is why the push trigger stays.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# One scan per ref: a new push to a pull request cancels the stale run; runs on
# main and the weekly schedule always finish.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/security-scan.yml
